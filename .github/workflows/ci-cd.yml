name: CI-CD Currency Converter

on:
  push:
    branches:
      - main

jobs:
  build-test-analyze:
    name: Build, Test, SonarQube, Nexus, Docker
    runs-on: ubuntu-latest

    env:
      SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      NEXUS_URL: ${{ secrets.NEXUS_URL }}
      NEXUS_USER: ${{ secrets.NEXUS_USER }}
      NEXUS_PASS: ${{ secrets.NEXUS_PASS }}
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
      DOCKER_IMAGE: "jagadapi240/currency-converter"

    outputs:
      docker_image: ${{ env.DOCKER_IMAGE }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: maven

      - name: Maven build + SonarQube
        run: |
          mvn -B clean verify sonar:sonar \
            -Dsonar.projectKey=currency-converter \
            -Dsonar.projectName="Currency Converter" \
            -Dsonar.host.url=$SONAR_HOST_URL \
            -Dsonar.login=$SONAR_TOKEN

      - name: Deploy artifact to Nexus
        run: |
          mvn -B deploy -DskipTests \
            -DaltDeploymentRepository=nexus::default::http://$NEXUS_USER:$NEXUS_PASS@${NEXUS_URL#http://}

      - name: Prepare WAR for Docker
        run: |
          mkdir -p deploy
          cp target/currency-converter.war deploy/app.war

      - name: Docker login
        run: |
          echo "${DOCKERHUB_TOKEN}" | docker login -u "${DOCKERHUB_USERNAME}" --password-stdin

      - name: Build Docker image
        run: |
          IMAGE_TAG=${{ github.run_number }}
          docker build -t ${DOCKER_IMAGE}:${IMAGE_TAG} .

      - name: Push Docker image
        run: |
          IMAGE_TAG=${{ github.run_number }}
          docker push ${DOCKER_IMAGE}:${IMAGE_TAG}
          docker tag ${DOCKER_IMAGE}:${IMAGE_TAG} ${DOCKER_IMAGE}:latest
          docker push ${DOCKER_IMAGE}:latest

  deploy:
    name: Deploy to EC2 Docker Host
    needs: build-test-analyze
    runs-on: ubuntu-latest

    env:
      DOCKER_IMAGE: "jagadapi240/currency-converter"

    steps:
      - name: Deploy over SSH to EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          envs: DOCKER_IMAGE
          script: |
            echo "Deploying image: ${DOCKER_IMAGE}:latest"

            # Remove container on port 8082
            PORT_CONTAINER=$(docker ps --filter "publish=8082" -q)
            if [ ! -z "$PORT_CONTAINER" ]; then
              echo "Stopping container on 8082: $PORT_CONTAINER"
              docker rm -f $PORT_CONTAINER || true
            fi

            # Remove old container by name
            docker rm -f currency-converter-app || true

            # Pull latest image
            docker pull ${DOCKER_IMAGE}:latest

            # Run new container
            docker run -d \
              --name currency-converter-app \
              -p 8082:8080 \
              ${DOCKER_IMAGE}:latest
